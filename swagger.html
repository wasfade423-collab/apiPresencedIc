<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Documentation interactive de l’API Présence DIC">
    <title>API Présence DIC — Swagger UI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
    >
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }

      .page-header {
        padding: 1rem 2rem;
        color: #fff;
        background: #17365d;
        font: 600 1rem/1.5 system-ui, sans-serif;
      }

      .page-header p {
        margin: 0;
      }

      .swagger-ui .wrapper {
        padding-top: 1rem;
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <p>API Présence DIC — documentation interactive</p>
    </header>
    <main id="swagger-ui"></main>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          persistAuthorization: false,
          tryItOutEnabled: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
